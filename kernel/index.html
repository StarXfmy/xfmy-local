<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Plan</title>
<meta name="description" content="课表、日历、待办与天气。数据只存在你自己这台设备上，没有服务器。">
<meta name="theme-color" content="#f6ead8">
<link rel="stylesheet" href="css/app.css">
<script>
/* 首屏别闪白：先按这台设备存过的偏好挂上 data-* */
try {
  var p = JSON.parse(localStorage.getItem('xfmy-local-prefs') || '{}');
  document.documentElement.setAttribute('data-font', p.font || 'default');
} catch (e) {}
</script>
<script>
/* 带 ?autopub=1 打开时，页面启动完自己点一次「立即发布」。
   这是给电脑上那个一键脚本用的：令牌存在这个窗口的存储里，命令行读不到，
   只能让页面自己去发。不带这个参数时下面整段不执行，日常打开完全不受影响。 */
if (new URLSearchParams(location.search).get('autopub') === '1') {
  window.__autopub = 'running';
  document.title = 'AUTOBOOT';
  (async function () {
    function say(txt, color) {
      var d = document.getElementById('autopubBanner');
      if (!d) {
        d = document.createElement('div');
        d.id = 'autopubBanner';
        d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;z-index:9999;' +
          'padding:10px 14px;font:13px/1.5 system-ui;color:#fff;background:#333');
        document.body ? document.body.appendChild(d) : document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
      }
      if (color) d.style.background = color;
      d.textContent = txt;
    }
    say('正在自动发布…');
    for (var tries = 0; tries < 20; tries++) {
      await new Promise(function (r) { setTimeout(r, 700); });
      try {
        var P = await import('./js/publish.js');
        // force：内容跟上次一样也重发一遍。双击这个动作的语义是"把线上刷新到最新"——
        // 快照没变但挂件脚本变了（比如换了文件名/地址）时，靠它把脚本也推上去。
        var report = await P.publish({ force: true });
        var word = (report && report.skipped) ? '（跟上次一样，没重复提交）' : String((report && report.report) || report || '已发布');
        document.title = 'AUTODONE|' + word.slice(0, 150);
        say(word.slice(0, 400), '#2e7d32');
        return;
      } catch (e) {
        var msg = (e && e.message) ? e.message : String(e);
        if (/没配|no config|not configured|配置/i.test(msg) === false && tries >= 6) {
          // 没有控制台可看：错误原文塞进窗口标题，Python 那边捞出来打印（截 150 字够定位了）
          document.title = 'AUTOFAIL|' + msg.slice(0, 150);
          say('自动发布没成功：' + msg.slice(0, 300) + '（你也可以自己在设置页点「立即发布」）', '#b3402f');
          return;
        }
      }
    }
    document.title = 'AUTOFAIL';
    say('等不到页面就绪，发布没执行。请自己在设置页点「立即发布」。', '#b3402f');
  })();
}
</script>

<body>
<header class="top">
  <h1>Day Plan</h1>
  <nav class="nav" id="nav"></nav>
</header>
<main id="view"><p class="hint">正在读本地数据…</p></main>
<p class="foot">数据只存在这台设备上，没有服务器兜底。只用手机可以先不管「同步」页，但隔段时间点一次「导出全量备份」更保险。</p>
<div class="toast" id="toast" role="status"></div>
<script src="js/lunar.js"></script>
<script type="module" src="js/main.js"></script>
<script>
/* xfmy-offline-register —— 由 build_phone.py 注入，别手改 */
/* 一次性维护：解开「旧壳一直发旧文件」的死锁。
   页面本身能从网络取到（它走 networkFirst），但壳里缓存的 JS 会一直是旧的，
   而壳自己的更新又可能被 HTTP 缓存卡住。所以这一版页面只要被打开过一次，
   就主动注销旧壳、清空所有缓存、重载一次；之后按下面的逻辑重新注册新壳。 */
if (navigator.onLine !== false && 'serviceWorker' in navigator && location.protocol !== 'file:') {
  try {
    if (!localStorage.getItem('xfmy-shell-reset-1')) {
      localStorage.setItem('xfmy-shell-reset-1', '1');
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        return caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        });
      }).then(function () { location.reload(); });
    }
  } catch (e) { }
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    // updateViaCache:'none' 让浏览器检查 sw.js 时绕开 HTTP 缓存（GitHub 给它设了 10 分钟缓存，
    // 结果就是"推了新包、手机上却一直吃旧壳"）；reg.update() 再立刻主动查一次。
    navigator.serviceWorker.register('/xfmy-local/sw.js', { scope: '/xfmy-local/', updateViaCache: 'none' }).then(function (reg) {
      try { reg.update(); } catch (e) { }
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            window.dispatchEvent(new CustomEvent('xfmy-update-ready'));
          }
        });
      });
    }).catch(function (e) { console.warn('离线壳注册失败：', e && e.message); });
  });
}
</script>
</body>
</html>
